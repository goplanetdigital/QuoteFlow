name: QuoteFlow Regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pricing-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run pricing and payment regression checks
        run: node --test tests/*.test.mjs
      - name: Production API smoke check (read-only and invalid payment only)
        env:
          QUOTEFLOW_BASE_URL: https://quote-flow-go-planet-digital.vercel.app
        run: node tests/production-smoke.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build check
        run: npm run build
